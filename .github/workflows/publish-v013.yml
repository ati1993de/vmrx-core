name: Publish verified VMRX Core v0.1.3 (Windows + Linux)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v013.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vmrx-core-v013-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish only verified, exactly pinned v0.1.3 binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_REPO: ati1993de/vmrx-core
      GH_TOKEN: ${{ github.token }}
      VMRX_SOURCE_SHA: b90d236f9433ffc9158c24d8a7b6f7f1c0e5d844
      WINDOWS_RUN_ID: '40187138005'
      LINUX_RUN_ID: '40187138034'
    steps:
      - name: Checkout release manifest and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release source and mainline consensus checks
        shell: bash
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES_v0.1.3.md
          git cat-file -e "${VMRX_SOURCE_SHA}^{commit}"
          # Release metadata may change, but the EXACT source and build/CI
          # recipe previously tested must be identical to mainline.
          git diff --exit-code "${VMRX_SOURCE_SHA}" HEAD -- \
            src external cmake contrib CMakeLists.txt Makefile .gitmodules \
            assets scripts .github/workflows/windows-core.yml .github/workflows/linux-core.yml
          # Do not release artifacts from another repo, an older v0.1.2 build,
          # another commit, or a failed/incomplete CI run.
          for run in "${WINDOWS_RUN_ID}" "${LINUX_RUN_ID}"; do
            sha="$(gh api "repos/${GH_REPO}/actions/runs/${run}" --jq '.head_sha')"
            status="$(gh api "repos/${GH_REPO}/actions/runs/${run}" --jq '.status')"
            result="$(gh api "repos/${GH_REPO}/actions/runs/${run}" --jq '.conclusion')"
            echo "Required mainnet CI ${run}: commit=${sha} status=${status} conclusion=${result}"
            test "${sha}" = "${VMRX_SOURCE_SHA}"
            test "${status}" = completed
            test "${result}" = success
          done
          echo 'PASS: exact SHA + both actual mainnet build pipelines verified'

      - name: Download CI-proven v0.1.3 binaries from the SAME commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/windows stage/linux release
          gh run download "${WINDOWS_RUN_ID}" -R "${GH_REPO}" \
            --name vmrx-windows-core-buildtest --dir stage/windows
          gh run download "${LINUX_RUN_ID}" -R "${GH_REPO}" \
            --name vmrx-core-linux-v013 --dir stage/linux

          test -s stage/windows/VMRX-Core-windows-x86_64-buildtest.zip
          test -s stage/windows/SHA256SUMS
          (cd stage/windows && sha256sum -c SHA256SUMS)
          unzip -t stage/windows/VMRX-Core-windows-x86_64-buildtest.zip
          unzip -Z1 stage/windows/VMRX-Core-windows-x86_64-buildtest.zip | grep -Eq '(^|/)vmrxd\.exe$'
          unzip -Z1 stage/windows/VMRX-Core-windows-x86_64-buildtest.zip | grep -Eq '(^|/)vmrx\.ico$'

          test -s stage/linux/VMRX-Core-linux-x86_64-v0.1.3.tar.gz
          test -s stage/linux/SHA256SUMS
          (cd stage/linux && sha256sum -c SHA256SUMS)
          tar -tzf stage/linux/VMRX-Core-linux-x86_64-v0.1.3.tar.gz | grep -Eq '^\./vmrxd$'

          cp stage/windows/VMRX-Core-windows-x86_64-buildtest.zip \
            release/VMRX-Core-windows-x86_64-v0.1.3.zip
          cp stage/linux/VMRX-Core-linux-x86_64-v0.1.3.tar.gz release/

      - name: Enforce new immutable version and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.3 -R "${GH_REPO}" >/dev/null 2>&1 || \
             gh api "repos/${GH_REPO}/git/ref/tags/v0.1.3" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing v0.1.3 tag or release'
            exit 1
          fi
          (cd release && sha256sum VMRX-Core-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -lh release/

      - name: Publish Core v0.1.3 from exactly tested SHA
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.3 \
            release/VMRX-Core-windows-x86_64-v0.1.3.zip \
            release/VMRX-Core-linux-x86_64-v0.1.3.tar.gz \
            release/SHA256SUMS \
            --target "${GITHUB_SHA}" -R "${GH_REPO}" \
            --latest --title 'VMRX Core v0.1.3 — standalone P2P reliability update' \
            --notes-file RELEASE_NOTES_v0.1.3.md
          gh release view v0.1.3 -R "${GH_REPO}"
