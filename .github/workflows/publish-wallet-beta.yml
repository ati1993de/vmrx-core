name: Publish validated VMRX native Wallet Beta (Windows and Linux)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-wallet-beta.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vmrx-wallet-beta-publish
  cancel-in-progress: false

jobs:
  verified-wallet-beta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ati1993de/vmrx-core
      CORE_SOURCE_SHA: d9c6b6c08c3b473b3b918f04ca1856a587686dfd
      WIN_RUN: '40188876789'
      LINUX_RUN: '40188876802'
      SEED_RECOVERY_RUN: '40190734788'
      TAG: v0.1.3-wallet-beta.1
    steps:
      - name: Checkout release sources with legal notices
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source and authentic native recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          for run in "$WIN_RUN" "$LINUX_RUN"; do
            source="$(gh api "repos/$REPO/actions/runs/$run" --jq '.head_sha')"
            test "$source" = "$CORE_SOURCE_SHA" || { echo "Core binary source mismatch $run"; exit 1; }
          done
          result="$(gh api "repos/$REPO/actions/runs/$SEED_RECOVERY_RUN" --jq '.conclusion')"
          test "$result" = success || { echo 'Native Windows/Linux deterministic seed recovery not both green'; exit 1; }
          # No consensus/node/wallet engine code may change after tested binaries.
          gh api "repos/$REPO/compare/$CORE_SOURCE_SHA...${GITHUB_SHA}" --jq '.files[].filename' > /tmp/source-diff-paths.txt
          if grep -E '^src/|^contrib/|^external/|^cmake/|^CMakeLists.txt$|^Makefile$' /tmp/source-diff-paths.txt; then
            echo 'Engine source changed since tested native binaries; new native builds and tests mandatory'
            exit 1
          fi
          echo 'PASS: exact native binaries have green Windows and Linux create/open/seed recovery tests'
      - name: Download individually verified VMRX Windows and Linux wallet binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vmrx-win /tmp/vmrx-linux
          gh run download "$WIN_RUN" -R "$REPO" -n vmrx-v013-wallet-windows-diagnostic-binaries -D /tmp/vmrx-win
          gh run download "$LINUX_RUN" -R "$REPO" -n vmrx-v013-wallet-linux-diagnostic-binaries -D /tmp/vmrx-linux
          test "$(find /tmp/vmrx-win -type f -name vmrxd.exe | wc -l)" -eq 1
          test "$(find /tmp/vmrx-win -type f -name monero-wallet-rpc.exe | wc -l)" -eq 1
          test "$(find /tmp/vmrx-linux -type f -name vmrxd | wc -l)" -eq 1
          test "$(find /tmp/vmrx-linux -type f -name monero-wallet-rpc | wc -l)" -eq 1
      - name: Assemble branded release archives, licenses and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/windows/core out/linux/core
          cp -a /tmp/vmrx-win/. out/windows/core/
          cp -a /tmp/vmrx-linux/. out/linux/core/
          mv out/windows/core/monero-wallet-rpc.exe out/windows/core/vmrx-wallet-rpc.exe
          mv out/linux/core/monero-wallet-rpc out/linux/core/vmrx-wallet-rpc
          chmod 0755 out/linux/core/vmrxd out/linux/core/vmrx-wallet-rpc
          cp LICENSE out/windows/LICENSE
          cp LICENSE out/linux/LICENSE
          cat > out/windows/README-WALLET-BETA.txt <<'EOF'
          VMRX Core v0.1.3 wallet beta (Windows x64)
          Run the VMRX native daemon vmrxd.exe and local vmrx-wallet-rpc.exe.
          This executable was built exclusively from fork-native VMRX Core sources.
          Wallet HTTP RPC: localhost only. Prefer GUI Node & Miner wallet tab.
          Genesis: 405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4
          BETA: new seed restore identity passed on Windows and Linux.
          UNTESTED: real funded transfers, founder wallet seed recovery, security audit.
          Do not deposit significant funds; save mnemonic OFFLINE and test recovery.
          EOF
          cp out/windows/README-WALLET-BETA.txt out/linux/README-WALLET-BETA.txt
          cat > out/windows/core/BINARY-PROVENANCE.txt <<EOF
          Native binary source commit: $CORE_SOURCE_SHA
          Windows compile workflow: $WIN_RUN
          Linux compile workflow: $LINUX_RUN
          Native Windows/Linux deterministic recovery: $SEED_RECOVERY_RUN
          Node version: v0.1.3; wallet build status: beta
          EOF
          cp out/windows/core/BINARY-PROVENANCE.txt out/linux/core/BINARY-PROVENANCE.txt
          test -s out/windows/core/vmrxd.exe
          test -s out/windows/core/vmrx-wallet-rpc.exe
          test -s out/linux/core/vmrxd
          test -s out/linux/core/vmrx-wallet-rpc
          (cd out/windows && zip -qr ../VMRX-Core-wallet-beta-windows-x64.zip .)
          (cd out/linux && tar -czf ../VMRX-Core-wallet-beta-linux-x64.tar.gz .)
          (cd out && sha256sum VMRX-Core-wallet-beta-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          unzip -l out/VMRX-Core-wallet-beta-windows-x64.zip | grep -F core/vmrx-wallet-rpc.exe
          tar -tzf out/VMRX-Core-wallet-beta-linux-x64.tar.gz | grep -F core/vmrx-wallet-rpc
      - name: Prepare clearly labeled experimental wallet release notes
        shell: bash
        run: |
          cat > out/RELEASE_NOTES.md <<'EOF'
          ## VMRX Core v0.1.3 — Wallet Beta 1
          
          Experimental fork-native Windows x64 and Linux x64 wallet-RPC binaries,
          packaged with VMRX Core v0.1.3 daemon and open-source license.
          Wallet binaries are named vmrx-wallet-rpc(.exe), not upstream Monero.
          
          Tested in independent GitHub Actions environments (Windows and Linux):
          wallet create, encrypted keys saved, wallet close/reopen, mnemonic seed
          restored from block height zero into a different file, primary address
          and view key preserved, correct VMRX mainnet genesis.
          
          IMPORTANT: NOT a stable wallet release, not audited. No real funded
          receive/send transaction or historical founder wallet recovery proven.
          Never share your recovery words, never use Monero or VMESH seed files.
          Verify checksum and seed recovery with zero/low funds before use.
          Wallet RPC must bind 127.0.0.1 with strong credentials.
          
          Mainnet genesis: 405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4
          Native source: d9c6b6c08c3b473b3b918f04ca1856a587686dfd
          Recovery confirmation: https://github.com/ati1993de/vmrx-core/actions/runs/40190734788
          Website: https://randomx.vargamesh.com/
          EOF
      - name: Publish GitHub pre-release only after all provenance and native recovery gates
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to silently replace assets"
            exit 1
          fi
          gh release create "$TAG" out/VMRX-Core-wallet-beta-windows-x64.zip out/VMRX-Core-wallet-beta-linux-x64.tar.gz out/SHA256SUMS \
            --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "VMRX Core v0.1.3 + Wallet Beta 1" --notes-file out/RELEASE_NOTES.md
          gh release view "$TAG" -R "$REPO" --json tagName,isPrerelease,assets
