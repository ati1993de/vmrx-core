name: VMRX Core - native Windows x64 build and network checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-core.yml'
      - 'src/**'
      - 'external/**'
      - 'cmake/**'
      - 'contrib/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.gitmodules'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-core.yml'
      - 'src/**'
      - 'external/**'
      - 'cmake/**'
      - 'contrib/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.gitmodules'

permissions:
  contents: read

jobs:
  linux-reference-genesis:
    name: Released Linux v0.1.0 mainnet genesis reference
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install release runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-chrono1.83.0t64 libboost-filesystem1.83.0 libboost-program-options1.83.0 libboost-thread1.83.0 libboost-serialization1.83.0 libhidapi-libusb0 libunbound8
      - name: Verify and unpack published mainnet Linux binary (immutable reference)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-reference logs
          curl --fail --location --retry 3 \
            -o linux-reference/vmrx-release.tar.gz \
            https://github.com/ati1993de/vmrx-core/releases/download/v0.1.0/VMRX-Core-linux-x86_64-v0.1.0.tar.gz
          echo "399e0c4695127b533c373a29239703a5a369e0e43434a49ddd378b007114147f  linux-reference/vmrx-release.tar.gz" | sha256sum -c -
          tar -xzf linux-reference/vmrx-release.tar.gz -C linux-reference
          find linux-reference -type f -name monerod -print
      - name: Run reference Linux daemon offline and capture genesis blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tempfile, time, urllib.request
          binaries = list(pathlib.Path('linux-reference').rglob('monerod'))
          if len(binaries) != 1:
              raise SystemExit(f'Expected exactly one Linux monerod, found {len(binaries)}')
          exe = binaries[0].resolve()
          exe.chmod(exe.stat().st_mode | 0o111)
          print('Linux reference monerod SHA256:', hashlib.sha256(exe.read_bytes()).hexdigest(), flush=True)
          data_dir = pathlib.Path(tempfile.mkdtemp(prefix='vmrx-ref-'))
          out = pathlib.Path('logs')
          out.mkdir(exist_ok=True)
          args = [str(exe), '--non-interactive', '--offline', '--data-dir', str(data_dir),
                  '--p2p-bind-ip', '127.0.0.1', '--p2p-bind-port', '29780',
                  '--rpc-bind-ip', '127.0.0.1', '--rpc-bind-port', '29781',
                  '--no-zmq', '--no-igd', '--disable-dns-checkpoints',
                  '--check-updates', 'disabled', '--log-file', str(out / 'linux-node.log')]
          p = subprocess.Popen(args, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          def rpc(method, args):
              body=json.dumps({'jsonrpc':'2.0','id':'0','method':method,'params':args}).encode()
              req=urllib.request.Request('http://127.0.0.1:29781/json_rpc',data=body,headers={'Content-Type':'application/json'})
              return json.load(urllib.request.urlopen(req,timeout=3))
          try:
              for i in range(45):
                  if p.poll() is not None:
                      raise RuntimeError('Linux reference node exited: '+str(p.returncode))
                  time.sleep(2)
                  try:
                      result=rpc('get_block_header_by_height',{'height':0})
                      if result.get('result',{}).get('block_header'):break
                  except Exception:pass
              else:raise RuntimeError('Linux reference node RPC not ready')
              raw=rpc('get_block',{'height':0})
              report={'source':'published VMRX Core v0.1.0 Linux x86_64, SHA256 verified',
                      'release_sha256':'399e0c4695127b533c373a29239703a5a369e0e43434a49ddd378b007114147f',
                      'header':result['result']['block_header'],
                      'blob':raw.get('result',{}).get('blob'),
                      'block_json':raw.get('result',{}).get('json')}
              (out/'linux-reference-genesis.json').write_text(json.dumps(report,indent=2))
              observed=report['header']['hash']
              print('LINUX RELEASE GENESIS:',observed,flush=True)
              print('LINUX RELEASE HEADER:',json.dumps(report['header'],sort_keys=True),flush=True)
              expected='405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4'
              if observed!=expected:raise RuntimeError('Linux v0.1.0 binary does not match documented mainnet: '+observed)
          finally:
              p.terminate()
              try:p.wait(timeout=8)
              except subprocess.TimeoutExpired:p.kill()
              err=p.stderr.read().decode(errors='replace') if p.stderr else ''
              (out/'linux-stderr.log').write_text(err[-30000:])
          PY
      - name: Preserve real Linux genesis reference for binary-to-binary comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-linux-v010-genesis-reference
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  windows-core:
    name: Native Windows Core (MSYS2 / MinGW64)
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout the actual VMRX source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up native 64-bit MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            file
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-pkgconf

      # HIDAPI and libusb are optional hardware-wallet dependencies; their
      # former MSYS2 package names are not available on this runner.
      # This first native build targets the daemon; USB hardware-wallet support
      # must be configured separately if a wallet build requires it.

      - name: Install pinned MSYS2 HIDAPI/libusb packages from official mirror
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p msys2-deps
          curl --fail --location --retry 3 --output msys2-deps/hidapi.pkg.tar.zst https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst
          curl --fail --location --retry 3 --output msys2-deps/libusb.pkg.tar.zst https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst
          printf '%s  %s\n' '89fb61549a437d65076a092a367fcb264fc7045ee9ebef48cd81f5a76a5588f8' 'msys2-deps/hidapi.pkg.tar.zst' '124edc26b009678a4c5e759481a364abf63ed7f2f49a53092e8bd0a47c0c0740' 'msys2-deps/libusb.pkg.tar.zst' | sha256sum -c -
          pacman --noconfirm -U msys2-deps/hidapi.pkg.tar.zst msys2-deps/libusb.pkg.tar.zst

      - name: Check independent VMRX network constants
        run: |
          set -euo pipefail
          grep -Eq 'CRYPTONOTE_NAME[[:space:]]+"vmrx"' src/cryptonote_config.h
          grep -Eq 'DIFFICULTY_TARGET_V2[[:space:]]+120' src/cryptonote_config.h
          grep -Eq 'CRYPTONOTE_MINED_MONEY_UNLOCK_WINDOW[[:space:]]+60' src/cryptonote_config.h
          echo 'PASS: VMRX constants present in checked-out source'

      - name: Compile the real VMRX Windows node from source
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -euo pipefail
          mkdir -p buildlogs
          make release-static-win64-daemon -j2 2>&1 | tee buildlogs/windows-daemon-build.log

      - name: Show compilation errors on failure
        if: failure()
        run: |
          if [ -f buildlogs/windows-daemon-build.log ]; then
            echo "=== Last 120 native Windows build log lines ==="
            tail -n 120 buildlogs/windows-daemon-build.log
            echo "=== Compiler errors ==="
            grep -En 'fatal error:| error:|CMake Error|undefined reference|make.*Error' buildlogs/windows-daemon-build.log | tail -n 60 || true
          fi

      - name: Collect Windows executables and DLL dependencies
        run: |
          set -euo pipefail
          mkdir -p package/core
          node_path="$(find build -type f -name monerod.exe -print -quit)"
          if [ -z "$node_path" ]; then
            echo 'ERROR: The actual VMRX monerod.exe was not produced'
            exit 1
          fi
          cp "$node_path" package/core/monerod.exe
          for exe in monero-wallet-cli.exe monero-wallet-rpc.exe; do
            found="$(find build -type f -name "$exe" -print -quit)"
            if [ -n "$found" ]; then cp "$found" "package/core/$exe"; fi
          done
          # Windows-native MinGW executables may need MinGW runtime DLLs.
          # Recursively collect only DLLs available in this build toolchain,
          # not arbitrary files from the runner or a Monero release.
          pending=(package/core/*.exe)
          while [ "${#pending[@]}" -gt 0 ]; do
            current="${pending[0]}"
            pending=("${pending[@]:1}")
            while IFS= read -r dll; do
              [ -n "$dll" ] || continue
              if [ -f "/mingw64/bin/$dll" ] && [ ! -f "package/core/$dll" ]; then
                cp "/mingw64/bin/$dll" "package/core/$dll"
                pending+=("package/core/$dll")
              fi
            done < <(objdump -p "$current" 2>/dev/null | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p')
          done
          find package/core -maxdepth 1 -type f -printf '%f\\n' | sort
          test -s package/core/monerod.exe

      - name: Verify Windows executable is a real PE program
        run: |
          set -euo pipefail
          file package/core/monerod.exe
          file package/core/monerod.exe | grep -q 'PE32+'

      - name: Node startup test - inspect VMRX genesis via local RPC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $daemon = Join-Path $PWD "package/core/monerod.exe"
          $dataDir = Join-Path $env:RUNNER_TEMP "vmrx-windows-genesis-smoke"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $arguments = @(
            "--non-interactive", "--offline",
            "--data-dir", $dataDir,
            "--p2p-bind-ip", "127.0.0.1", "--p2p-bind-port", "29780",
            "--rpc-bind-ip", "127.0.0.1", "--rpc-bind-port", "29781",
            "--no-zmq", "--no-igd", "--disable-dns-checkpoints",
            "--check-updates", "disabled",
            "--log-file", (Join-Path $dataDir "windows-smoke.log")
          )
          $process = Start-Process -FilePath $daemon -ArgumentList $arguments -WorkingDirectory (Split-Path $daemon) -PassThru -WindowStyle Hidden
          try {
            $info = $null
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "VMRX daemon exited early with code $($process.ExitCode)" }
              try {
                $info = Invoke-RestMethod -Uri "http://127.0.0.1:29781/get_info" -TimeoutSec 3
                if ($info.height -ge 1) { break }
              } catch {}
            }
            if ($null -eq $info -or $info.height -lt 1) { throw "VMRX node RPC did not start" }
            $body = @{jsonrpc="2.0";id="0";method="get_block_header_by_height";params=@{height=0}} | ConvertTo-Json -Depth 5
            $res = Invoke-RestMethod -Uri "http://127.0.0.1:29781/json_rpc" -Method POST -ContentType "application/json" -Body $body
            $expected = "405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4"
            $actual = [string]$res.result.block_header.hash
            New-Item -ItemType Directory -Force -Path "buildlogs" | Out-Null
            $diagnostic = @{
              expected_genesis = $expected
              actual_genesis = $actual
              is_match = ($actual -eq $expected)
              daemon_sha256 = (Get-FileHash -Path $daemon -Algorithm SHA256).Hash
              source_commit = (& git rev-parse HEAD)
              mainnet_config_nonce = 22093001
              rpc_get_info = $info
              rpc_genesis_header = $res.result.block_header
            }
            try {
              $rawRequest = @{jsonrpc="2.0";id="0";method="get_block";params=@{height=0}} | ConvertTo-Json -Depth 5
              $rawResult = Invoke-RestMethod -Uri "http://127.0.0.1:29781/json_rpc" -Method POST -ContentType "application/json" -Body $rawRequest
              $diagnostic.rpc_genesis_block_blob = [string]$rawResult.result.blob
              $diagnostic.rpc_genesis_block_json = [string]$rawResult.result.json
            } catch {
              $diagnostic.rpc_get_block_error = [string]$_
            }
            $diagnostic | ConvertTo-Json -Depth 12 | Set-Content "buildlogs/windows-genesis.json" -Encoding utf8
            Write-Host ("VMRX Windows genesis: major={0} minor={1} nonce={2} hash={3}" -f $res.result.block_header.major_version,$res.result.block_header.minor_version,$res.result.block_header.nonce,$actual)
            if ($actual -ne $expected) {
              throw "VMRX CHAIN INCOMPATIBILITY: expected $expected, got $actual. Review buildlogs/windows-genesis.json (full genesis block blob and header) against the existing Linux mainnet. Never change the expected hash without proving a matching consensus chain."
            }
            Write-Host "PASS: Native Windows VMRX daemon starts and reports correct genesis $actual"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path (Join-Path $dataDir "windows-smoke.log")) {
              New-Item -ItemType Directory -Force -Path "buildlogs" | Out-Null
              Copy-Item (Join-Path $dataDir "windows-smoke.log") "buildlogs/windows-smoke.log" -Force
            }
          }

      - name: Preserve Windows genesis and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-windows-core-diagnostics
          path: buildlogs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build checksum-verified Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path "docs/RELEASE_STATUS.md" -Destination "package/core/RELEASE_STATUS.md"
          Copy-Item -Path "LICENSE" -Destination "package/core/LICENSE"
          Compress-Archive -Path "package/core/*" -DestinationPath "release/VMRX-Core-windows-x86_64-buildtest.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path "release/VMRX-Core-windows-x86_64-buildtest.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VMRX-Core-windows-x86_64-buildtest.zip" | Set-Content -Path "release/SHA256SUMS" -Encoding ascii
          Get-ChildItem -Path release | Format-Table Name,Length

      - name: Upload reviewed-build candidate (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-windows-core-buildtest
          path: release/*
          if-no-files-found: error
          retention-days: 30
